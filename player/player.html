<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>POL плеер · polimuli</title>
<style>
  body { background:#0b1220; color:#cfd8e3; margin:0; display:flex;
         flex-direction:column; align-items:center;
         font-family:"Segoe UI", Arial, sans-serif; }
  .wrap { max-width: 980px; width:100%; padding:18px 12px 40px; }
  h1 { font-size:18px; letter-spacing:2px; margin:0 0 6px; }
  #info { color:#8fa3b9; font-size:13px; margin-bottom:10px; }
  #error { color:#ffb3a0; background:#2a1216; border:1px solid #5a2430;
           border-radius:8px; padding:10px 14px; display:none; margin-bottom:12px; }
  #stage canvas { width:100%; height:auto; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  .hint { color:#5c7089; font-size:12px; margin-top:12px; }
  code { background:#16202e; padding:1px 6px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>▶ POL · ПЛЕЕР ПОЛИАРТ</h1>
  <div id="info">общий формат эпизодов polimuli</div>
  <div id="error">⚠</div>
  <div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
  <p class="hint">
    Открытие: <code>?src=/episodes/16_express_strela.pol</code> (через HTTP; обычный и
    корневой относительный путь работают) или
    <code>?pol=&lt;JSON&gt;</code> (закодированный, работает из file://).
    Клик по холсту — пауза/продолжить.
  </p>
</div>
<script src="../engine/polimuli_engine.js"></script>
<script src="../engine/polimuli_runtime.js"></script>
<script>window.__POL_DEMO__ = null;</script>
<script src="polimuli_player.js"></script>
</body>
</html>

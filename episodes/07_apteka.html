<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Полимульт №07 — Аптека Подорожника</title>
<style>
  body { background:#eef3ee; margin:0; display:flex; flex-direction:column; align-items:center;
         font-family: "Segoe UI", Arial, sans-serif; color:#23322b; }
  #wrap { max-width: 960px; width:100%; }
  canvas { width:100%; height:auto; display:block; border-radius:10px; box-shadow:0 10px 40px rgba(30,60,40,.25); }
  h1 { font-size:20px; letter-spacing:2px; margin:14px 6px 4px; }
  .sub { font-size:13px; color:#68816f; margin:0 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🌿 АПТЕКА ПОДОРОЖНИКА</h1>
  <p class="sub">Полимульт №07 · микромир и здоровье · pilot</p>
  <canvas id="cv" width="960" height="540"></canvas>
</div>
<script src="../engine/polimuli_engine.js"></script>
<script>
const CV = Polimuli.makeCanvas('cv', 960, 540);
const W = CV.W, H = CV.H, ctx = CV.ctx;
const P = new Polimuli.Particles();

const CELL = { x: 400, y: 300, r: 150 };
const ORGS = Array.from({ length: 10 }, (_, i) => ({
  a: (i * 137.5) * Math.PI / 180, d: 40 + (i % 5) * 22, s: 5 + (i % 3) * 3
}));

function drawLab(t) {
  const g = ctx.createRadialGradient(W / 2, 240, 80, W / 2, 300, 560);
  g.addColorStop(0, '#d9ecd9'); g.addColorStop(1, '#b7d4c2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#7fb0a0';
  ctx.fillRect(0, 480, W, 60);
  ctx.fillStyle = '#6b9888';
  for (let x = 0; x < W; x += 46) { ctx.fillRect(x, 480, 24, 6); }
}

function drawCell(t) {
  const { x, y, r } = CELL;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#5a9a78'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#e8f2ec';
  ctx.beginPath(); ctx.ellipse(x - 20, y - 10, 62, 78, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b7d4c2';
  ctx.beginPath(); ctx.ellipse(x - 14, y - 6, 46, 60, 0, 0, Math.PI * 2); ctx.fill();
  for (const o of ORGS) {
    const oa = o.a + t * 0.12;
    const ox = x + Math.cos(oa) * o.d, oy = y + Math.sin(oa) * o.d;
    ctx.fillStyle = '#7fc49a';
    ctx.beginPath(); ctx.arc(ox, oy, o.s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawDoctor(t) {
  const dx = 120 + Math.sin(t * 0.25) * 14;
  const bob = Math.sin(t * 2.2) * 4;
  Polimuli.drawEmoji(ctx, '🌿', dx, 430 + bob, 84);
  Polimuli.drawEmoji(ctx, '🩺', dx + 26, 412 + bob, 30);
  Polimuli.drawEmoji(ctx, '💊', dx - 30, 440 + bob + Math.sin(t * 1.1) * 6, 24);
}

function drawFight(t) {
  const phase = (t % 10) / 10;
  if (phase > 0.55 && phase < 0.92) {
    const vx = 520 + (phase - 0.55) * 500;
    Polimuli.drawEmoji(ctx, '🦠', Math.min(vx, 760), 250 + Math.sin(t * 6) * 14, 52);
    if (Math.random() < 0.3)
      P.spawn({ x: Math.min(vx, 760), y: 250, vx: -30, vy: (Math.random() - .5) * 60,
        life: 0.5, size: 14, emoji: '💥' });
  }
  const sx = 480 + Math.sin(t * 3) * 10, sy = 240 + Math.cos(t * 4) * 8;
  Polimuli.drawEmoji(ctx, '🛡️', sx, sy, 50);
  if (Math.random() < 0.08)
    P.spawn({ x: sx + (Math.random() - .5) * 40, y: sy, vx: 0, vy: -10 - Math.random() * 10,
      life: 0.8, size: 10, emoji: '✨' });
}

function drawTonic(t) {
  if (Math.random() < 0.1)
    P.spawn({ x: 760 + (Math.random() - .5) * 60, y: 460, vx: (Math.random() - .5) * 30,
      vy: -30 - Math.random() * 30, life: 2.4, size: 22 + Math.random() * 18,
      emoji: ['💊', '🧪', '🍊'][(Math.random() * 3) | 0], gravity: 20 });
  Polimuli.drawEmoji(ctx, '🧪', 780, 460 + Math.sin(t * 1.3) * 6, 60);
  Polimuli.drawEmoji(ctx, '🥦', 260, 470 + Math.sin(t * 0.9) * 5, 54);
}

const ACTS = [
  [0.0, 'ПИЩЕВАРЕНИЕ — ПУТЬ ЕДЫ'],
  [4.0, 'ПРОСТУДА — ВИРУС ПРОТИВ ЛЕЙКОЦИТОВ'],
  [8.0, 'СОН — МОЗГ-ДИРИЖЁР'],
  [12.0, 'ВИТАМИНЫ — ДРУЖИНЫ ЭНЕРГИИ'],
  [16.0, 'ЗУБЫ — ОТРЯД ЗУБНОЙ ПАСТЫ'],
  [20.0, 'МОЗГ — ГЛАВНЫЙ ШТАБ'],
];
function actOf(t) {
  let a = '🧬 ВНУТРИ ТЕЛА';
  for (const [from, name] of ACTS) if (t >= from % 24) a = name;
  return a;
}

function frame(t, dt) {
  ctx.clearRect(0, 0, W, H);
  drawLab(t);
  drawCell(t);
  drawTonic(t);
  drawDoctor(t);
  drawFight(t);
  P.update(dt); P.draw(ctx);

  ctx.font = '22px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,40,20,0.45)';
  ctx.fillText(actOf(t), W / 2 + 2, 86 + 2);
  ctx.fillStyle = '#174a30';
  ctx.fillText(actOf(t), W / 2, 86);

  Polimuli.drawHUD(ctx, W, H, ((t % 24) / 24), 1, 'Сцена: клетка-город', { labelColor: '#174a30', barColor: '#4a9a6a' });
}

let lastT = 0;
const startT = performance.now();
function loop(now) {
  const t = (now - startT) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;
  frame(t, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

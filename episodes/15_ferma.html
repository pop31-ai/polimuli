<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Полимульт №15 — Ферма выходного дня</title>
<style>
  body { background:#2c4a22; margin:0; display:flex; flex-direction:column; align-items:center;
         font-family: "Segoe UI", Arial, sans-serif; color:#e8f0d2; }
  #wrap { max-width: 960px; width:100%; }
  canvas { width:100%; height:auto; display:block; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size:20px; letter-spacing:2px; margin:14px 6px 4px; }
  .sub { font-size:13px; color:#a8c294; margin:0 6px 12px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🚜 ФЕРМА ВЫХОДНОГО ДНЯ</h1>
  <p class="sub">Полимульт №15 · пасторальный ситком · pilot</p>
  <canvas id="cv" width="960" height="540"></canvas>
</div>
<script src="../engine/polimuli_engine.js"></script>
<script>
const CV = Polimuli.makeCanvas('cv', 960, 540);
const W = CV.W, H = CV.H, ctx = CV.ctx;
const P = new Polimuli.Particles();

const PATCHES = [
  { x: 0, y: 210, c: '#8fbf5a' }, { x: 480, y: 210, c: '#6fa34a' },
  { x: 0, y: 380, c: '#c9a24a' }, { x: 480, y: 380, c: '#5a8f3f' },
];

function drawField(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#9fd0e8'); g.addColorStop(0.35, '#cfe8a8'); g.addColorStop(1, '#4a7030');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe082';
  ctx.beginPath(); ctx.arc(120, 70, 30, 0, Math.PI * 2); ctx.fill();
  for (const p of PATCHES) {
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 480, 170);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(p.x + i * 80, p.y + 8); ctx.lineTo(p.x + i * 80, p.y + 160); ctx.stroke();
    }
    ctx.setLineDash([]);
  }
}

function drawTractor(t) {
  const x = ((t * 60) % (W + 160)) - 80;
  Polimuli.drawEmoji(ctx, '🚜', x, 140 + Math.sin(x * 0.05) * 8, 90);
  if (Math.random() < 0.06)
    P.spawn({ x: x - 30, y: 150, vx: -20, vy: -20 - Math.random() * 20, life: 0.5, size: 10, emoji: '💨' });
}

function drawFarm(t) {
  const phase = (t % 18) / 18;
  Polimuli.drawEmoji(ctx, '🐔', 440 + Math.sin(t * 2) * 6, 490 + Math.sin(t * 3) * 4, 42);
  Polimuli.drawEmoji(ctx, '🐄', 860, 496 + Math.sin(t * 1.1) * 4, 52);
  const coster = Math.max(0, Math.sin(phase * Math.PI * 2));
  Polimuli.drawEmoji(ctx, '🌻', 60 + Math.sin(t * 3) * 3, 300, 36 + coster * 16);
  Polimuli.drawEmoji(ctx, '🌽', 140 + Math.sin(t * 2.6) * 4, 320, 34 + coster * 22);
  Polimuli.drawEmoji(ctx, '🌾', 260, 250 + Math.sin(t * 1.8) * 4, 40);
  const beeX = 700 + Math.cos(t * 0.8) * 130;
  const beeY = 200 + Math.sin(t * 0.8) * 70;
  Polimuli.drawEmoji(ctx, '🐝', beeX, beeY, 30);
  Polimuli.drawEmoji(ctx, '🍯', 760, 260 + Math.sin(t * 1.4) * 6, 30);
  Polimuli.drawEmoji(ctx, '🧺', 300, 500 + Math.sin(t * 0.9) * 4, 50);
  Polimuli.drawEmoji(ctx, '🏡', 60, 180 + Math.sin(t * 0.7) * 3, 66);
  if (Math.random() < 0.08)
    P.spawn({ x: Math.random() * W, y: 400 + Math.random() * 80,
      vx: (Math.random() - .5) * 20, vy: -20, life: 2, size: 14,
      emoji: ['🧀', '🥕', '🍅', '🥚'][(Math.random() * 4) | 0], gravity: 100 });
}

function drawSeasons(t) {
  const s = Math.floor(t / 6) % 4;
  const SEAS = ['ВЕСНА 🌱', 'ЛЕТО ☀️', 'ОСЕНЬ 🌾', 'ЗИМА ❄️'];
  Polimuli.drawEmoji(ctx, '🧑‍🌾', 230, 460 + Math.sin(t * 2.1) * 5, 60);
  if (s === 0) Polimuli.drawEmoji(ctx, '🌱', 420, 470, 40);
  if (s === 2) { Polimuli.drawEmoji(ctx, '🌾', 420, 470, 44);
                 ctx.fillStyle = '#e8d9a0'; ctx.fillRect(380, 470, 130, 8); }
  if (s === 3) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(0, 200, W, 300); }
  ctx.save();
  ctx.globalAlpha = 0.35;
  Polimuli.drawEmoji(ctx, SEAS[s], W / 2, 60, 60);
  ctx.restore();
}

const ACTS = [
  [0, 'ВЕСНА: ПОСЕВ'],
  [6, 'ЛЕТО: ПОЛИВ И УХОД'],
  [12, 'ОСЕНЬ: ЖАТВА'],
  [18, 'ЗИМА: ТЕПЛО В СТОЙЛЕ'],
  [24, 'ГОД ФЕРМЫ 🕰️'],
];
function actOf(t) {
  let a = '🌾 ФЕРМА';
  for (const [from, name] of ACTS) if (t >= from) a = name;
  return a;
}

function frame(t, dt) {
  ctx.clearRect(0, 0, W, H);
  drawField(t);
  drawTractor(t);
  drawSeasons(t);
  drawFarm(t);
  P.update(dt); P.draw(ctx);

  ctx.font = '24px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(20,40,10,0.5)';
  ctx.fillText(actOf(t), W / 2 + 2, 84 + 2);
  ctx.fillStyle = '#f4fbe0';
  ctx.fillText(actOf(t), W / 2, 84);

  Polimuli.drawHUD(ctx, W, H, ((t % 30) / 30), 1, 'Сцена: поле', { labelColor: '#e8f0d2', barColor: '#a8c294' });
}

let lastT = 0;
const startT = performance.now();
function loop(now) {
  const t = (now - startT) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;
  frame(t, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

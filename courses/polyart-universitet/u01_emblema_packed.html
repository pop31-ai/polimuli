<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>POL · Университет · Эмблема и Кодекс</title>
<style>
  body{background:#0b1220;color:#cfd8e3;margin:0;display:flex;flex-direction:column;align-items:center;
       font-family:"Segoe UI",Arial,sans-serif}
  .wrap{max-width:980px;width:100%;padding:16px}
  h1{font-size:18px;letter-spacing:2px;margin:0 0 4px}
  #info{color:#8fa3b9;font-size:13px;margin-bottom:10px}
  #stage canvas{width:100%;height:auto;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
  #err{color:#ffb3a0;background:#2a1216;border:1px solid #5a2430;border-radius:8px;padding:10px 14px;display:none}

<body>
<div class="wrap">
  <h1>▶ Университет · Эмблема и Кодекс</h1>
  <div id="info">университет · ролик · товарищ профессор Полиартова · упаковано pack v1 · клик = пауза</div>
  <div id="err">⚠</div>
  <div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
</div>
<script>/* polimuli_engine.js
 * Мини-движок для полиарт-мультфильмов (Canvas 2D).
 * Без зависимостей. Предоставляет:
 *  - холст с автопультом размеров
 *  - «сценарный таймлайн»: сцены {'from','to','draw'}
 *  - системy частиц (эмодзи-спрайты, серый цвет по умолчанию)
 *  - эмодзи-спрайт-рендер (тень для «тёмных» сцен)
 *  - подпись-титры / прогресс-бар
 */

var Polimuli = (() => {
  function makeCanvas(id, W, H) {
    const cv = document.getElementById(id);
    if (!cv) return null;
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    return { cv, ctx, W, H };
  }

  // Эмодзи можно рисовать либо <canvas> (если есть эмодзи-фонт), либо
  // заполнять стандартным emoji-шрифтом браузера.
  function drawEmoji(ctx, emoji, x, y, size, alignCenter = true) {
    ctx.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, x, y);
  }

  // Система частиц. Каждая частица: {x,y,vx,vy,life,maxLife,size,emoji|color,gravity}
  class Particles {
    constructor() { this.list = []; }
    spawn(o) {
      this.list.push({
        x: o.x, y: o.y, vx: o.vx || 0, vy: o.vy || 0,
        life: o.life || 1, maxLife: o.life || 1,
        size: o.size || 16, emoji: o.emoji || null,
        color: o.color || null, gravity: o.gravity || 0,
        alpha: o.alpha != null ? o.alpha : 1,
      });
    }
    burst(n, make) { for (let i = 0; i < n; i++) this.spawn(make(i)); }
    update(dt) {
      const alive = [];
      for (const p of this.list) {
        p.life -= dt;
        if (p.life <= 0) continue;
        p.vy += p.gravity * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        alive.push(p);
      }
      this.list = alive;
    }
    draw(ctx) {
      for (const p of this.list) {
        const t = p.life / p.maxLife;
        const size = p.size * (0.6 + 0.4 * t);
        if (p.emoji) {
          ctx.globalAlpha = p.alpha * t;
          drawEmoji(ctx, p.emoji, p.x, p.y, size);
        } else {
          ctx.globalAlpha = p.alpha * t;
          ctx.fillStyle = p.color || '#ffffff';
          ctx.beginPath(); ctx.arc(p.x, p.y, size / 2, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  // Прогресс-бар + подпись текущей сцены (режиссёрская подсказка).
  function drawHUD(ctx, W, H, t, total, label, opts = {}) {
    if (opts.label) {
      ctx.font = `14px monospace`;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillStyle = opts.labelColor || 'rgba(255,255,255,0.85)';
      ctx.fillText(`🎬 ${label}`, 10, 8);
    }
    const bw = W - 20, bh = 4;
    const bx = 10, by = H - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = opts.barColor || 'rgba(255,255,255,0.8)';
    ctx.fillRect(bx, by, bw * Math.min(1, t / total), bh);
  }

  // Таймлайн: сцены со стартовым {from} и окончанием {to}.
  class Timeline {
    constructor(scenes) { this.scenes = scenes; }
    find(t) {
      for (const s of this.scenes) if (t >= s.from && t < s.to) return s;
      return null;
    }
  }

  return { makeCanvas, drawEmoji, Particles, drawHUD, Timeline };
})();
</script>
<script>/* polimuli_runtime.js
 * Интерпретатор формата POL (Poly Animation Language) поверх движка
 * polimuli_engine.js. Чистые данные -> живой Canvas.
 *
 * API:
 *   const ctrl = Polimuli.play(data, canvasIdOrEl);
 *   ctrl.pause(); ctrl.resume(); ctrl.stop();
 *
 * Плеер рисует: фон-акты с перетеканием цвета, акторы-эмодзи
 * (bob/sway/pulse/key/cycle), частицы, заголовок акта, HUD.
 */

var Polimuli = (() => {
  const base = (typeof Polimuli !== 'undefined' && Polimuli) || {};
  // ---------- helpers ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3
      ? h[0] + h[0] + h[1] + h[1] + h[2] + h[2] : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToCss(rgb) {
    return `rgb(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0})`;
  }
  function lerpColor(a, b, t) {
    const r1 = hexToRgb(a), r2 = hexToRgb(b);
    return rgbToCss(r1.map((c, i) => lerp(c, r2[i], t)));
  }

  // Deterministic pseudo-random (hash), чтобы зерно мела не дрожало по кадрам.
  function chalkRand(seed) {
    let x = (seed | 0) || 1;
    return () => {
      x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
      return ((x < 0 ? ~x + 1 : x) % 10000) / 10000;
    };
  }

  // Меловой след: текст рисуется от руки шероховатым «мелом» — несколько
  // полупрозрачных проходов с микро-смещениями + зернистые точки поверх.
  // font ДОЛЖЕН быть установлен до вызова. Возвращает ширину текста.
  function chalkTextWidth(ctx, txt, fontPx) {
    ctx.font = `${fontPx}px "Segoe UI", Arial, sans-serif`;
    return ctx.measureText(txt).width;
  }
  function drawChalkText(ctx, txt, x, y, fontPx, color, seed, alpha = 1) {
    ctx.font = `${fontPx}px "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const rnd = chalkRand(seed);
    // основной след чуть приглушённый
    ctx.globalAlpha = alpha * 0.82;
    ctx.fillStyle = color;
    ctx.fillText(txt, x, y);
    // «труд»: неровные наложения мела — микродрожание руки
    for (let n = 0; n < 4; n++) {
      ctx.globalAlpha = alpha * (0.15 + 0.12 * rnd());
      ctx.fillText(txt,
        x + (rnd() - 0.5) * 1.4,
        y + (rnd() - 0.5) * 1.4);
    }
    // зернистость мела — меловые точки по низу букв
    const w = ctx.measureText(txt).width;
    const grains = Math.round(w * fontPx * 0.004);
    ctx.globalAlpha = alpha * 0.5;
    for (let g = 0; g < grains; g++) {
      const gx = x + rnd() * w;
      const gy = y + rnd() * (fontPx * 0.95);
      ctx.fillRect(gx, gy, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- предобработка данных ----------
  function prep(data) {
    const acts = (data.acts || []).slice().sort((a, b) => a.at - b.at);
    const dur = data.meta && data.meta.dur ? data.meta.dur : 24;
    const actors = (data.actors || []).map(a => {
      const key = (a.key || a.acts || []).slice().sort((p, q) => p.at - q.at);
      return {
        id: a.id, emoji: a.emoji, x: a.x || 0, y: a.y || 0,
        size: a.size || 40, bob: a.bob, sway: a.sway,
        pulse: a.pulse, cycle: a.cycle, key, visible: a.visible,
      };
    });
    const fx = (data.particles || []).map(p => ({
      from: p.from, x: p.x, y: p.y, dx: p.dx || 0, dy: p.dy || 0,
      emoji: p.emoji, rate: p.rate != null ? p.rate : 0.05,
      vx: p.vx || 0, vy: p.vy != null ? p.vy : 0,
      life: p.life != null ? p.life : 1, size: p.size || 14,
      gravity: p.gravity || 0, alpha: p.alpha != null ? p.alpha : 1,
    }));
    return { data, acts, dur, actors, fx };
  }

  function atAct(acts, t) {
    let cur = null;
    for (const a of acts) if (t >= a.at) cur = a;
    return cur;
  }
  function nextAct(acts, t) {
    for (const a of acts) if (a.at > t) return a;
    return null;
  }

  // ключи: возвращает значение компонента `field` в момент t или null
  function keyVal(key, t, field, base) {
    if (!key.length) return null;
    if (t <= key[0].at && key[0][field] != null) return key[0][field];
    const last = key[key.length - 1];
    if (t >= last.at) return last[field] != null ? last[field] : null;
    for (let i = 0; i < key.length - 1; i++) {
      const a = key[i], b = key[i + 1];
      if (t >= a.at && t < b.at) {
        const f = a[field] != null ? a[field] : base;
        const g = b[field] != null ? b[field] : base;
        return lerp(f, g, (t - a.at) / Math.max(1e-6, b.at - a.at));
      }
    }
    return null;
  }

  // ---------- плеер ----------
  function play(data, id) {
    const P = prep(data);
    const CV = Polimuli.makeCanvas(id, data.canvas.w, data.canvas.h);
    if (!CV) throw new Error('canvas not found: ' + id);
    const ctx = CV.ctx, W = CV.W, H = CV.H;
    const Parts = new Polimuli.Particles();
    const st = P.data.style || {};
    const caption = st.caption || {};
    const hud = st.hud || {};
    const board = Object.assign({
      x: 640, y: 130, w: 300, h: 260,
      bg: '#2e4632', frame: '#8a5a2a', text: '#f2e6c8',
      font: 18, step: 1.4,
      title: '',        // заголовок доски (шапка)
      titleColor: '#e8cf9a',
      gutter: 6,        // толщина рамки
      padX: 16, padY: 14,
      rowH: 34,         // шаг строки
      pen: '✍️',        // пишущая рука/мел
      rep: '',          // представитель (аватар лектора) у доски, '' = выкл
      repSize: 44,      // размер представителя
    }, st.board || {});
    // Индексы стилей ролей (плашки подсветки)
    const ROLE = {
      thesis:  { fill: 'rgba(240,230,200,0.10)', color: '#f4ecd8', lw: 1.6 },
      diagram: { fill: 'rgba(120,170,220,0.12)',  color: '#bfd9f0', lw: 1.2 },
      result:  { fill: 'rgba(158,43,37,0.35)',   color: '#ffe2b8', lw: 2.0 },
      note:    { fill: 'rgba(90,143,192,0.16)',  color: '#d3e6f5', lw: 1.0 },
    };

    const ctrl = { running: true, _t: 0, _start: null };

    function actorPos(a, t) {
      let x = keyVal(a.key, t, 'x', a.x);
      if (x == null) x = a.x;
      let y = keyVal(a.key, t, 'y', a.y);
      if (y == null) y = a.y;
      let size = keyVal(a.key, t, 'size', a.size);
      if (size == null) size = a.size;
      if (a.sway) x += Math.sin(t * a.sway.speed) * a.sway.amp;
      if (a.bob) y += Math.sin(t * a.bob.speed) * a.bob.amp;
      if (a.pulse) { const k = 1 + Math.sin(t * a.pulse.speed) * a.pulse.amp; size *= k; }
      return { x, y, size };
    }
    function actorEmoji(a, t) {
      if (!a.cycle) return a.emoji;
      const arr = a.cycle.emojis;
      return arr[Math.floor(t / a.cycle.period) % arr.length];
    }

    function drawBg(t) {
      const cur = atAct(P.acts, t);
      const nxt = nextAct(P.acts, t);
      const curBg = cur && cur.bg;
      const nxtBg = nxt && nxt.bg;
      if (!curBg && !nxtBg) {
        ctx.fillStyle = '#10151f';
        ctx.fillRect(0, 0, W, H);
        return;
      }
      let k = 0;
      if (curBg && nxtBg && nxt) {
        const span = Math.max(1, nxt.at - cur.at);
        k = clamp((t - cur.at) / span, 0, 1);
      }
      const top = nxtBg && curBg ? lerpColor(curBg.top, nxtBg.top, k)
                : (curBg ? curBg.top : nxtBg.top);
      const bottom = nxtBg && curBg ? lerpColor(curBg.bottom, nxtBg.bottom, k)
                   : (curBg ? curBg.bottom : nxtBg.bottom);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, top); g.addColorStop(1, bottom);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawActors(t) {
      for (const a of P.actors) {
        if (a.visible === false) continue;
        if (a.visible && typeof a.visible === 'object') {
          if (t < a.visible.from || t >= a.visible.to) continue;
        }
        const p = actorPos(a, t);
        Polimuli.drawEmoji(ctx, actorEmoji(a, t), p.x, p.y, p.size);
      }
    }

    function updateFx(t, dt) {
      for (const f of P.fx) {
        if (Math.random() > f.rate * dt) continue;
        let x = f.x, y = f.y;
        if (f.from) {
          const src = P.actors.find(a => a.id === f.from);
          if (src) { const p = actorPos(src, t); x = p.x; y = p.y; }
          else continue;
        }
        Parts.spawn({
          x: x + f.dx, y: y + f.dy, vx: f.vx, vy: f.vy,
          life: f.life, size: f.size, emoji: f.emoji,
          gravity: f.gravity, alpha: f.alpha,
        });
      }
      Parts.update(dt);
    }

    function drawCaption(t) {
      const cur = atAct(P.acts, t);
      if (!cur || !cur.text) return;
      ctx.font = `${caption.font || 24}px "Segoe UI", Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = caption.shadow || 'rgba(0,0,0,0.5)';
      ctx.fillText(cur.text, W / 2 + 2, 84 + 2);
      ctx.fillStyle = caption.color || '#f0ead8';
      ctx.fillText(cur.text, W / 2, 84);
    }

    function drawBoard(t) {
      const cur = atAct(P.acts, t);
      const lines = cur && Array.isArray(cur.board) ? cur.board : null;
      if (!lines || lines.length < 1) return;
      const g = board.gutter;
      const titleH = board.title ? (board.font * 0.9) : 0;

      // рама и полотно
      ctx.fillStyle = board.frame;
      ctx.fillRect(board.x, board.y, board.w, board.h);
      ctx.fillStyle = board.bg;
      ctx.fillRect(board.x + g, board.y + g, board.w - 2 * g, board.h - 2 * g);

      // заголовок доски (шапка) — тема лекции
      if (board.title) {
        ctx.font = `bold ${Math.round(board.font * 0.95)}px "Segoe UI", Arial, sans-serif`;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillStyle = board.titleColor;
        ctx.fillText(board.title, board.x + board.padX, board.y + g + 4);
        // линия под шапкой
        ctx.fillStyle = 'rgba(240,230,200,0.25)';
        ctx.fillRect(board.x + board.padX, board.y + g + 4 + board.font, board.w - 2 * board.padX, 1);
      }

      function rowTop(i) {
        return board.y + g + 10 + titleH + i * board.rowH;
      }

      for (let i = 0; i < lines.length; i++) {
        const lineStart = cur.at + i * board.step;
        if (t < lineStart) break;
        const item = lines[i];
        const txt = typeof item === 'string' ? item : (item && item.t != null ? item.t : '');
        if (!txt) continue;
        const role = (item && item.role) || 'note';
        const st = ROLE[role] || ROLE.note;
        const indent = (item && typeof item.indent === 'number') ? item.indent : 0;
        const rowY = rowTop(i);
        const fontPx = (item && item.font) ? item.font : board.font;
        const textX = board.x + board.padX + indent;

        // доля «письма от руки»: строка пишется слева направо в окне board.step
        const handW = Math.max(0.6, board.step * 0.85);
        const f = clamp((t - lineStart) / handW, 0, 1);

        // плашка подсветки по роли
        if (st.fill) {
          ctx.fillStyle = st.fill;
          ctx.fillRect(board.x + board.padX - 4, rowY - 3,
                       board.w - 2 * board.padX + 8, board.rowH - 4);
        }

        // перо/рука у доски: старание — пишущая рука ведёт по строке
        const chalkColor = (item && item.color) ? item.color : st.color;
        const txtW = Math.max(2, chalkTextWidth(ctx, txt, fontPx));
        const reveal = f * txtW;
        ctx.save();
        ctx.beginPath();
        ctx.rect(textX - 2, rowY - 3, reveal + 4, board.rowH);
        ctx.clip();
        // «труд»: меловой след пишется от руки по доске в окне раскрытия
        drawChalkText(ctx, txt, textX, rowY, fontPx, chalkColor, i + 1, 1);
        ctx.restore();

        // маркер-буллет для role != note
        if (role !== 'note') {
          ctx.fillStyle = st.color;
          ctx.font = `${Math.round(fontPx * 0.9)}px "Segoe UI Emoji", sans-serif`;
          const bullet = role === 'result' ? '▸' : (role === 'diagram' ? '·' : '▪');
          ctx.fillText(bullet, textX - (bullet === '▸' ? 16 : 12), rowY + 1);
        }

        // Представитель / аватар лектора у доски — виден во время письма:
        // он реально «трудится»: стоит у пишущей строки, наклоняется к доске
        // и ведёт рукой-мелом по строке (старание, а не типографский вывод).
        if (board.rep && f > 0 && f < 1) {
          const repX = board.x + board.w - board.repSize * 0.6;
          const repY = rowY + board.rowH / 2 + Math.sin(t * 7) * 2;
          ctx.save();
          ctx.globalAlpha = 0.92;
          ctx.font = `${board.repSize}px "Segoe UI Emoji", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          // лёгкий наклон к доске в сторону пишущей строки
          ctx.translate(repX, repY);
          ctx.rotate(0.10 * (textX < board.x + board.w / 2 ? 1 : -1));
          ctx.fillText(board.rep, 0, 0);
          ctx.restore();
        }

        // пишущая рука/карандаш — видна, пока рука ведёт «чернило»
        if (f > 0 && f < 1) {
          const penX = textX + reveal;
          ctx.globalAlpha = 0.95;
          ctx.font = `${Math.round(fontPx * 0.95)}px "Segoe UI Emoji", sans-serif`;
          ctx.fillText(board.pen || '✍️', penX + 6, rowY);
          // меловая крошка из-под руки — настоящий «труд» (пыль с доски)
          if (Math.random() < 0.6) {
            Parts.spawn({
              x: penX + 4, y: rowY + fontPx * 0.8,
              vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 24,
              life: 0.4 + Math.random() * 0.3, size: 1 + Math.random() * 2,
              color: 'rgba(240,238,225,0.9)', gravity: 20, alpha: 0.7,
            });
          }
          ctx.globalAlpha = 1;
        }
      }
    }

    function frame(now) {
      if (!ctrl.running) return;
      if (!ctrl._start) ctrl._start = now;
      let t = (now - ctrl._start) / 1000;
      if (t > P.dur && P.data.meta.loop !== false) t = t % P.dur;
      const dt = Math.min(0.05, Math.max(1e-4, t - ctrl._t));
      ctrl._t = t;

      ctx.clearRect(0, 0, W, H);
      drawBg(t);
      drawActors(t);
      updateFx(t, dt);
      Parts.draw(ctx);
      drawBoard(t);
      drawCaption(t);

      Polimuli.drawHUD(ctx, W, H, t, P.dur,
        P.data.meta.title + ' · ' + ((atAct(P.acts, t) || {}).text || ''),
        { labelColor: hud.labelColor, barColor: hud.barColor });

      ctrl._raf = requestAnimationFrame(frame);
    }

    ctrl.pause = () => { if (ctrl.running) { ctrl.running = false; cancelAnimationFrame(ctrl._raf); } };
    ctrl.resume = () => { if (!ctrl.running) { ctrl.running = true; ctrl._start = null; ctrl._raf = requestAnimationFrame(frame); } };
    ctrl.stop = () => { ctrl.running = false; cancelAnimationFrame(ctrl._raf); };

    // клик — пауза; повторный — продолжить
    CV.cv.addEventListener('click', () => {
      if (ctrl.running) ctrl.pause(); else ctrl.resume();
    });

    ctrl._raf = requestAnimationFrame(frame);
    return ctrl;
  }

  return Object.assign(base, { play });
